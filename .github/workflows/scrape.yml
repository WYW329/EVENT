name: 抓取活動

on:
  schedule:
    - cron: '7,37 * * * *' # 每 30 分鐘（避開整點，GitHub 整點比較塞）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: 讀上次的資料和快取（data 分支）
        run: |
          git fetch --depth=1 origin data && git checkout origin/data -- data/ || echo "還沒有 data 分支"
      - name: 抓取
        run: node scraper/run.js
        env:
          WEKENGO_DETAIL_LIMIT: 250
      - name: 存到 data 分支（每次覆蓋成單一版本，不累積歷史）
        run: |
          out="$RUNNER_TEMP/pub"
          mkdir -p "$out/data"
          cp data/*.json "$out/data/"
          cd "$out"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -qm "活動資料 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data
