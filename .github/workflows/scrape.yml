name: 抓取活動

on:
  schedule:
    - cron: '7,37 * * * *' # 每 30 分鐘（避開整點，GitHub 整點比較塞）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: 抓取
        run: node scraper/run.js
      - name: 有變動就存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/status.json data/wekengo-cache.json data/opentix-cache.json
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新活動資料 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
