name = "event-radar"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# 網頁本體；/api/* 交給 Worker 處理
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 每分鐘檢查新活動和提醒
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "event-radar"
database_id = "9d2c8ce2-adaf-4f05-849d-f7c2708926e0"

[vars]
# 活動資料放在 data 分支（每次覆蓋成一個版本，repo 才不會越來越大）
EVENTS_URL = "https://raw.githubusercontent.com/WYW329/EVENT/data/data/events.json"
VAPID_PUBLIC_KEY = "BJpH9g1lzJdZR18lWNlWV07uUu828Vj5qGMU2JsPQUfF-5oTsnIbmWkQpxoZZwq1uBaRvochgB9A_yx2O44SZho"
VAPID_SUBJECT = "mailto:admin@example.com"
# VAPID_PRIVATE_KEY 用 `npx wrangler secret put VAPID_PRIVATE_KEY` 設定，不寫在這裡
