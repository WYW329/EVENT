services:
  - type: web
    name: taoyuan-events
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # 只有程式改動才重新部署；活動資料（data/）由伺服器直接從 GitHub 讀，不用重新部署
    buildFilter:
      ignoredPaths:
        - data/**
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EVENTS_URL
        sync: false # https://raw.githubusercontent.com/WYW329/EVENT/main/data/events.json
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: GIST_ID
        sync: false
      - key: GIST_TOKEN
        sync: false
      - key: MANUAL_KEY
        sync: false # 選填：設了之後，手動加入和刪除要輸入這個密碼
